<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estimating Rainfall</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-teal-400">
    <!-- Menu Bar -->
<div class="fixed top-0 inset-x-0 flex justify-center bg-white py-4 shadow-md z-50">
    <div class="flex justify-between items-center w-full max-w-5xl px-4">
      <!-- <h1 class="text-3xl font-extrabold text-gray-800 ">Innovatech</h1> -->
      <ul class="flex space-x-8">
        <li>
          <a href="#" class="text-gray-700 hover:text-blue-600 hover:underline transition duration-100">Home</a>
        </li>
        <li>
          <a href="#" class="text-gray-700 hover:text-blue-600 hover:underline transition duration-100">Crop Recommendation</a>
        </li>
        <li>
          <a href="#" class="text-gray-700 hover:text-blue-600 hover:underline transition duration-100">Crop Yield</a>
        </li>
        <li>
          <a href="#" class="text-gray-700 hover:text-blue-600 hover:underline transition duration-100">Rainfall Prediction</a>
        </li>
      </ul>
    </div>
  </div>
  
  <!-- Sidebar -->
  <div class="fixed inset-y-0 left-0 bg-white w-64 pt-24 shadow-lg">
    <div class="flex items-center justify-center mb-8 space-x-4 px-6">
      <img src="farm-technology-logo-design-template-vector-20929631.jpg" alt="Logo" class="w-12" />
      <h1 class="text-2xl font-extrabold text-gray-800">Innovatech</h1>
    </div>
    <div class="text-black font-medium text-lg px-6">
      <ul class="space-y-4">
        <li>
          <a href="#" class="block text-gray-700 hover:text-blue-600 transition duration-300">HP</a>
        </li>
        <li>
          <a href="#" class="block text-gray-700 hover:text-blue-600 transition duration-300">Info.</a>
        </li>
      </ul>
    </div>
    <div class="bg-white rounded shadow-md p-6 w-full mt-6">
      <h5 class="text-lg font-bold mb-4">Soil Data</h5>
      <ul class="list-none space-y-2">
        <li class="flex justify-between hover:bg-green-100 p-2 rounded transition duration-300">
          <span class="text-gray-600">Nitrogen</span>
          <span class="text-gray-900">[Value]</span>
        </li>
        <li class="flex justify-between hover:bg-green-100 p-2 rounded transition duration-300">
          <span class="text-gray-600">Phosphorus</span>
          <span class="text-gray-900">[Value]</span>
        </li>
        <li class="flex justify-between hover:bg-green-100 p-2 rounded transition duration-300">
          <span class="text-gray-600">Potassium</span>
          <span class="text-gray-900">[Value]</span>
        </li>
        <li class="flex justify-between hover:bg-green-100 p-2 rounded transition duration-300">
          <span class="text-gray-600">Humidity</span>
          <span class="text-gray-900">[Value]</span>
        </li>
        <li class="flex justify-between hover:bg-green-100 p-2 rounded transition duration-300">
          <span class="text-gray-600">Temperature</span>
          <span class="text-gray-900">[Value]</span>
        </li>
        <li class="flex justify-between hover:bg-green-100 p-2 rounded transition duration-300">
          <span class="text-gray-600">Rainfall</span>
          <span class="text-gray-900">[Value]</span>
        </li>
      </ul>
    </div>
  </div>

    <!-- Form Container -->
    <div class="ml-72 mt-24 p-6 bg-white rounded shadow-lg">
        <h2 class="text-xl font-bold mb-4">Expected Rainfall</h2>
        <form id="rainfallForm">
            <div class="mb-4">
                <label for="state" class="block text-gray-700 mb-2">State:</label>
                <!-- make the select tag scollable-->
                <select id="state" class="w-full p-2 border rounded overflow-y-scroll">
                    <option value="ANDAMAN And NICOBAR ISLANDS">Andaman And Nicibar</option>
                    <option value="ARUNACHAL PRADESH">Arunachal Pradesh</option>
                    <option value="ASSAM">Assam</option>
                    <option value="MEGHALAYA">Meghalaya</option>
                    <option value="MANIPUR">Manipur</option>
                    <option value="MIZORAM">Mizoram</option>
                    <option value="NAGALAND">Nagaland</option>
                    <option value="TRIPURA">Tripura</option>
                    <option value="WEST BENGAL">West Bengal</option>
                    <option value="SIKKIM">Sikkim</option>
                    <option value="ORISSA">Orissa</option>
                    <option value="JHARKHAND">Jharkhand</option>
                    <option value="BIHAR">Bihar</option>
                    <option value="UTTAR PRADESH">Uttar Pradesh</option>
                    <option value="UTTARANCHAL">Uttaranchal</option>
                    <option value="HARYANA">Haryana</option>
                    <option value="CHANDIGARH">Chandigarh</option>
                    <option value="DELHI">Delhi</option>
                    <option value="PUNJAB">Punjab</option>
                    <option value="HIMACHAL">Himachal</option>
                    <option value="JAMMU AND KASHMIR">Jammu And Kashmir</option>
                    <option value="RAJASTHAN">Rajasthan</option>
                    <option value="MADHYA PRADESH">Madhya Pradesh</option>
                    <option value="GUJARAT">Gujarat</option>
                    <option value="DADAR NAGAR HAVELI">Dadar Nagar Haveli</option>
                    <option value="DAMAN AND DUI">Daman And Diu</option>
                    <option value="MAHARASHTRA">Maharashtra</option>
                    <option value="GOA">Goa</option>
                    <option value="CHATISGARH">Chatisgarh</option>
                    <option value="ANDHRA PRADESH">Andhra Pradesh</option>
                    <option value="TAMIL NADU">Tamil Nadu</option>
                    <option value="PONDICHERRY">Pondicherry</option>
                    <option value="KARNATAKA">Karnataka</option>
                    <option value="KERALA">Kerala</option>
                    <option value="LAKSHADWEEP">Lakshadweep</option>

                </select>
            </div>
            <div class="mb-4">
                <label for="district" class="block text-gray-700 mb-2">District:</label>
                <select id="district" class="w-full p-2 border rounded"></select>
            </div>
            <!--Month dropdown-->
            <div class="mb-4">
                <label for="month" class="block text-gray-700 mb-2">Month:</label>
                <select id="month" class="w-full p-2 border rounded">
                    <option value="January">January</option>
                    <option value="February">February</option>
                    <option value="March">March</option>
                    <option value="April">April</option>
                    <option value="May">May</option>
                    <option value="June">June</option>
                    <option value="July">July</option>
                    <option value="August">August</option>
                    <option value="September">September</option>
                    <option value="October">October</option>
                    <option value="November">November</option>
                    <option value="December">December</option>
                </select>
            </div>
            <button type="submit" class="bg-teal-500 text-white p-2 rounded">Estimate Rainfall</button>
            <!--a bordered Div with bg color to show output and height of 200 px with the text Estimated rainfall: in the center-->
            <div class="bg-teal-200 border border-teal-500 h-32 flex justify-center items-center mt-4">
                <span class="text-lg font-bold">Estimated Rainfall:</span>
            </div>
        </form>
    </div>
</body>

<script src = "rainfall.js"></script>

</html>
